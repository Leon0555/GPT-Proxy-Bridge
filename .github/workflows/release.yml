name: Build and release Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Leon0555/GPT-Proxy-Bridge'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test local proxy and storage
        shell: pwsh
        run: |
          dotnet run --project GPTProxyBridge.Tests/GPTProxyBridge.Tests.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build self-contained distribution
        shell: pwsh
        run: ./build.ps1
      - name: Publish version if not already released
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content GPTProxyBridge.App/GPTProxyBridge.App.csproj -Raw
          $version = $project.Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag already published; keeping existing release unchanged."; exit 0 }
          gh release create $tag "release/GPT-Proxy-Bridge-$version-win-x64.zip" "release/SHA256SUMS.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "GPT Proxy Bridge $version" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
